services:
  dev:
    build:
      context: .
      secrets:
        - extra_ca
    image: lro-dev:2
    # Reconstruit l'image si le Dockerfile ou les requirements ont changé (sinon le cache rend ça instantané)
    pull_policy: build
    volumes:
      - .:/work
    working_dir: /work
    # Fichiers créés avec l'utilisateur de la machine hôte (évite un build/ appartenant à root sous Linux)
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # Nécessaire pour gdb
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

secrets:
  # Certificat racine facultatif (réseau d'entreprise) : export EXTRA_CA_FILE=/chemin/ca.pem
  extra_ca:
    file: ${EXTRA_CA_FILE:-./docker/no_extra_ca.pem}
